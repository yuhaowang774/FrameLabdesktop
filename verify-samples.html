<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>模板库样张总览（dev）</title>
  <style>
    body { background: #f4f2ee; font: 14px/1.5 'Segoe UI', 'Microsoft YaHei', sans-serif; padding: 20px 24px; margin: 0; color: #333; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .tip { color: #888; font-size: 12px; margin-bottom: 14px; }
    .bar { position: sticky; top: 0; background: #f4f2ee; padding: 6px 0 10px; font-size: 12px; color: #b00020; z-index: 5; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
    .card { background: #fff; border: 1px solid #e2ddd4; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
    .card img { display: block; width: 100%; height: auto; background: #eee; min-height: 80px; }
    .card .meta { display: flex; justify-content: space-between; gap: 6px; }
    .card .name { font-size: 12px; color: #333; }
    .card .group { font-size: 10px; color: #999; white-space: nowrap; }
  </style>
</head>
<body>
  <h1>模板库样张总览（dev 页：npm run dev 后访问 /verify-samples.html）</h1>
  <div class="tip">全部内置模板 × 各自匹配样张真实合成（渲染路径与模板库卡片完全一致：sampleForTemplate + renderTemplateThumbDataUrl）。</div>
  <div class="bar" id="status">渲染中…</div>
  <div class="grid" id="root"></div>
  <script type="module">
    import { useTemplates } from '/src/composables/useTemplates.ts'
    import { renderTemplateThumbDataUrl } from '/src/core/templateThumb.ts'
    import { sampleForTemplate } from '/src/core/templateSamples.ts'

    const root = document.getElementById('root')
    const status = document.getElementById('status')
    const { templates } = useTemplates()
    const builtin = templates.filter((t) => t.builtin)
    let done = 0
    let failed = 0
    for (const t of builtin) {
      const card = document.createElement('div')
      card.className = 'card'
      const img = document.createElement('img')
      img.alt = t.name
      img.title = t.id
      const meta = document.createElement('div')
      meta.className = 'meta'
      meta.innerHTML = `<span class="name"></span><span class="group"></span>`
      meta.querySelector('.name').textContent = t.name
      meta.querySelector('.group').textContent = t.group ?? ''
      card.appendChild(img)
      card.appendChild(meta)
      root.appendChild(card)
      renderTemplateThumbDataUrl(t.config, sampleForTemplate(t.id), 640)
        .then((url) => {
          img.src = url
        })
        .catch(() => {
          failed++
        })
        .finally(() => {
          done++
          status.textContent = `${done}/${builtin.length} 完成${failed ? ` / ${failed} 失败` : ''}`
        })
    }
  </script>
</body>
</html>
