[package]
name = "framelab"
version = "0.1.0"
description = "FrameLab · 照片相框 & 背景合成工具（LrC 风格）"
authors = ["FrameLab"]
edition = "2021"

# Tauri 库 crate：桌面端与移动端共用入口
[lib]
name = "framelab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# 绿色版自更新：下载裸 exe（stream 分块）+ minisign 验签（复用 updater 公钥链）
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
minisign-verify = "0.2"
futures-util = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
