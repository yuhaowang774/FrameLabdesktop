[package]
name = "framelab"
version = "0.1.0"
description = "FrameLab · 照片相框 & 背景合成工具（LrC 风格）"
authors = ["FrameLab"]
edition = "2021"

# Tauri 库 crate：桌面端与移动端共用入口
[lib]
name = "framelab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
